name: Build smax_tray_client on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    strategy:
      matrix:
        os: [windows-2019, windows-2022]  # Windows 10 (Server 2019) & Windows 11 (Server 2022)
    runs-on: ${{ matrix.os }}

    env:
      BOOST_ROOT: C:/boost/boost_1_87_0

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check CMake version
      run: cmake --version
      shell: cmd

    - name: Setup Boost
      run: |
        echo Using Boost at %BOOST_ROOT%
        if not exist "%BOOST_ROOT%" (
          echo ERROR: BOOST_ROOT path does not exist!
          exit 1
        )
      shell: cmd

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 16 2019" -A x64 -DBOOST_ROOT=%BOOST_ROOT%
      shell: cmd

    - name: Build with MSBuild
      run: cmake --build build --config Release
      shell: cmd

    - name: Prepare dist folder and copy EXE and DLLs
      run: |
        mkdir dist
        copy build\Release\smax_tray_client.exe dist\
        if exist "%BOOST_ROOT%\stage\lib\" (
          xcopy "%BOOST_ROOT%\stage\lib\*.dll" dist\ /Y
        ) else (
          echo Boost DLL folder not found, skipping DLL copy
        )
      shell: cmd

    - name: List dist folder contents
      run: dir dist
      shell: cmd

    - name: Upload build artifacts
      uses: actions/upload-artifact@v2
      with:
        name: smax_tray_client-win-${{ matrix.os }}
        path: dist
