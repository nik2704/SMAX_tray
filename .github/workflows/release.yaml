name: Windows Build and Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild and MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache vcpkg
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}\vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
        if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        }

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Install Project (for CPack)
      shell: pwsh
      run: |
        cmake --install build --prefix build/_install --config Release

    - name: Package with CPack (NSIS)
      shell: pwsh
      run: |
        cd build
        cpack -G NSIS

    - name: Upload Installer to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/*.exe  # This will include the NSIS installer
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
