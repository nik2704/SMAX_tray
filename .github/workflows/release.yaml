name: Windows Build and Package

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild and MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache vcpkg and Installed Packages
      uses: actions/cache@v3
      with:
        path: |
          ${{ github.workspace }}\vcpkg
          ${{ github.workspace }}\vcpkg\installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg and Boost.Json
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"

        if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
          Write-Host "Cloning and bootstrapping vcpkg..."
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        } else {
          Write-Host "vcpkg already present."
        }

        Write-Host "Installing boost-json..."
        & "$env:VCPKG_ROOT\vcpkg.exe" install boost-json:x64-windows --recurse

    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 .. `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release

    - name: Run Tests (Optional)
      shell: pwsh
      run: |
        Write-Host "No tests defined. Skipping..."
        # cd build
        # ctest --output-on-failure

    - name: Upload Built Executable
      uses: actions/upload-artifact@v4
      with:
        name: smax-tray-client-executable
        path: build/Release/*.exe
