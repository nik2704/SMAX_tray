name: Windows Build and Package

on:
  push:
    tags:
      - 'v*'  # Triggers only on version tags like v1.0.0

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild and MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache vcpkg and Installed Packages
      uses: actions/cache@v3
      with:
        path: |
          ${{ github.workspace }}\vcpkg
          ${{ github.workspace }}\vcpkg\installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg and Boost.Json (Static)
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"

        if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
          Write-Host "Cloning and bootstrapping vcpkg..."
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        } else {
          Write-Host "vcpkg already present."
        }

        Write-Host "Installing boost-json (static)..."
        & "$env:VCPKG_ROOT\vcpkg.exe" install boost-json:x64-windows-static --recurse

    - name: Configure CMake (Forced Static Boost + Static Runtime)
      shell: pwsh
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DBoost_USE_STATIC_LIBS=ON `
          -DBoost_USE_STATIC_RUNTIME=ON `
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"

    - name: Build Project
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Upload EXE to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/Release/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}