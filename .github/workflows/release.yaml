name: Windows Build and Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild and MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache vcpkg and Installed Packages
      uses: actions/cache@v3
      with:
        path: |
          ${{ github.workspace }}\vcpkg
          ${{ github.workspace }}\vcpkg\installed
        key: ${{ runner.os }}-vcpkg-static-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-static-

    - name: Create custom vcpkg triplet for static Boost + shared CRT
      shell: pwsh
      run: |
        $tripletDir = "${{ github.workspace }}\vcpkg\triplets\community"
        New-Item -ItemType Directory -Force -Path $tripletDir | Out-Null
        Set-Content -Path "$tripletDir\x64-windows-booststatic.cmake" -Value @"
        set(VCPKG_TARGET_ARCHITECTURE x64)
        set(VCPKG_CRT_LINKAGE dynamic)
        set(VCPKG_LIBRARY_LINKAGE static)
        "@

    - name: Install vcpkg and Boost.Json (Static)
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
        $env:TRIPLET = "x64-windows-booststatic"

        # Check if vcpkg.exe exists. If not, clone and bootstrap.
        if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
          Write-Host "vcpkg.exe not found, cloning vcpkg repository..."
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        } else {
          Write-Host "vcpkg.exe found, assuming vcpkg was restored from cache."
          # If vcpkg.exe exists, ensure bootstrap is run just in case, or skip if confident.
          # Running bootstrap again is generally safe and quick if already done.
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        }

        & "$env:VCPKG_ROOT\vcpkg.exe" install boost-json:$env:TRIPLET --recurse

    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 .. `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows-booststatic `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload EXE to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/Release/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # or use a custom token if required
