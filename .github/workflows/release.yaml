name: Windows Build and Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild and MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache vcpkg and Installed Packages
      uses: actions/cache@v3
      with:
        path: |
          ${{ github.workspace }}\vcpkg
          ${{ github.workspace }}\vcpkg\installed
        key: ${{ runner.os }}-vcpkg-static-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-static-

    - name: Create custom vcpkg triplet for static Boost + shared CRT
      shell: pwsh
      run: |
        $tripletDir = "${{ github.workspace }}\vcpkg\triplets\community"
        New-Item -ItemType Directory -Force -Path $tripletDir | Out-Null
        Set-Content -Path "$tripletDir\x64-windows-booststatic.cmake" -Value @"
        set(VCPKG_TARGET_ARCHITECTURE x64)
        set(VCPKG_CRT_LINKAGE dynamic)
        set(VCPKG_LIBRARY_LINKAGE static)
        "@

    - name: Show created triplet file (debug)
      shell: pwsh
      run: |
        Get-ChildItem "${{ github.workspace }}\vcpkg\triplets\community"
        Get-Content "${{ github.workspace }}\vcpkg\triplets\community\x64-windows-booststatic.cmake"

    - name: Install vcpkg and Boost.Json (Static)
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
        $env:TRIPLET = "x64-windows-booststatic"
        # Set VCPKG_OVERLAY_TRIPLETS to include your custom triplet directory
        $env:VCPKG_OVERLAY_TRIPLETS = "${{ github.workspace }}\vcpkg\triplets\community"

        $bootstrapScriptPath = "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

        if (-not (Test-Path $bootstrapScriptPath)) {
          Write-Host "bootstrap-vcpkg.bat not found. Cloning vcpkg repository."
          if (Test-Path $env:VCPKG_ROOT) {
              Remove-Item -Recurse -Force $env:VCPKG_ROOT
          }
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
        } else {
          Write-Host "bootstrap-vcpkg.bat found (vcpkg likely restored from cache)."
        }

        & $bootstrapScriptPath

        & "$env:VCPKG_ROOT\vcpkg.exe" install boost-json:$env:TRIPLET --recurse

    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 .. `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=$env:TRIPLET `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload EXE to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/Release/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}